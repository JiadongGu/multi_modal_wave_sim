# skrl PPO for pillar navigation: a small CNN on the camera, a dense branch on the lidar, joined.
seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -0.5
    network:
      - name: camera_features
        input: permute(OBSERVATIONS["camera"], (0, 3, 1, 2))
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
          - linear: 256
          - linear: 32
        activations: [relu, relu, relu, null, elu, elu]
      - name: lidar_features
        input: OBSERVATIONS["lidar"]
        layers: [128, 32]
        activations: elu
      - name: net
        input: concatenate([camera_features, lidar_features])
        layers: [128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: camera_features
        input: permute(OBSERVATIONS["camera"], (0, 3, 1, 2))
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
          - linear: 256
          - linear: 32
        activations: [relu, relu, relu, null, elu, elu]
      - name: lidar_features
        input: OBSERVATIONS["lidar"]
        layers: [128, 32]
        activations: elu
      - name: net
        input: concatenate([camera_features, lidar_features])
        layers: [128, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 64
  learning_epochs: 4
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.003
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: True
  experiment:
    directory: "usv_pillar"
    experiment_name: ""
    write_interval: 64
    checkpoint_interval: 6400

trainer:
  class: SequentialTrainer
  timesteps: 64000                  # 1000 iterations of 64 steps
  environment_info: log
